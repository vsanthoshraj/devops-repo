steps:

  # ============================================================
  # 1. BUILD DOCKER IMAGE
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'BUILD-IMAGE'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'
      - '.'


  # ============================================================
  # 2. PUSH IMAGE TO ARTIFACT REGISTRY
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'PUSH-IMAGE'
    waitFor:
      - 'BUILD-IMAGE'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'


  # ============================================================
  # 3. TRIVY SECURITY SCAN
  #
  # Scan image ONCE and generate JSON.
  # JSON becomes the source for other reports.
  # ============================================================
  - name: 'aquasec/trivy:0.72.0'
    id: 'TRIVY-SCAN'
    waitFor:
      - 'PUSH-IMAGE'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e

        echo "=========================================="
        echo "        TRIVY SECURITY SCAN"
        echo "=========================================="

        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"

        echo "Image:"
        echo "$$IMAGE"

        # --------------------------------------------------------
        # Generate timestamp
        # Example: 2026-08-20_14-30-45
        # --------------------------------------------------------
        TIMESTAMP=$$(date -u +"%Y-%m-%d_%H-%M-%S")

        echo "$$TIMESTAMP" > /workspace/trivy_timestamp

        echo ""
        echo "Scan started:"
        date -u

        START_TIME=$$(date +%s)

        # --------------------------------------------------------
        # Scan image ONCE
        # --------------------------------------------------------
        echo ""
        echo "Running Trivy..."

        trivy image \
          --severity HIGH,CRITICAL \
          --timeout 10m \
          --format json \
          --output /workspace/trivy-report.json \
          "$$IMAGE"

        END_TIME=$$(date +%s)

        DURATION=$$((END_TIME - START_TIME))

        echo "$$DURATION" > /workspace/trivy_duration

        echo ""
        echo "=========================================="
        echo "        TRIVY SCAN COMPLETED"
        echo "=========================================="

        echo "Scan duration: $$DURATION seconds"
        echo "Timestamp: $$TIMESTAMP"

        echo ""
        echo "JSON report:"
        ls -lh /workspace/trivy-report.json

        echo ""
        echo "=========================================="


  # ============================================================
  # 4. GENERATE HTML REPORT
  #
  # Convert the JSON generated by Trivy.
  # This avoids scanning the image again.
  # ============================================================
  - name: 'aquasec/trivy:0.72.0'
    id: 'GENERATE-HTML'
    waitFor:
      - 'TRIVY-SCAN'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e

        echo "=========================================="
        echo "Generating Trivy HTML report"
        echo "=========================================="

        trivy convert \
          --format template \
          --template "@contrib/html.tpl" \
          --output /workspace/trivy-report.html \
          /workspace/trivy-report.json

        echo ""
        echo "HTML report generated:"
        ls -lh /workspace/trivy-report.html

        echo "=========================================="


  # ============================================================
  # 5. CREATE SCAN METADATA
  # ============================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'CREATE-METADATA'
    waitFor:
      - 'GENERATE-HTML'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        TIMESTAMP=$$(cat /workspace/trivy_timestamp)
        DURATION=$$(cat /workspace/trivy_duration)

        cat > /workspace/metadata.json <<EOF
        {
          "project_id": "$PROJECT_ID",
          "build_id": "$BUILD_ID",
          "commit_sha": "$COMMIT_SHA",
          "branch": "$BRANCH_NAME",
          "image": "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA",
          "region": "${_REGION}",
          "repository": "${_REPOSITORY}",
          "image_name": "${_IMAGE}",
          "scan_timestamp_utc": "$$TIMESTAMP",
          "scan_duration_seconds": $$DURATION,
          "scanner": "Trivy",
          "trivy_version": "0.72.0",
          "severity": "HIGH,CRITICAL"
        }
        EOF

        echo "Metadata:"
        cat /workspace/metadata.json


  # ============================================================
  # 6. UPLOAD ALL REPORTS TO CLOUD STORAGE
  #
  # Folder:
  #
  # 2026-08-20_14-30-45_BUILD_ID/
  #
  # Files:
  #   trivy-report.html
  #   trivy-report.json
  #   metadata.json
  # ============================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'UPLOAD-REPORTS'
    waitFor:
      - 'CREATE-METADATA'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        TIMESTAMP=$$(cat /workspace/trivy_timestamp)

        REPORT_PATH="gs://${_REPORT_BUCKET}/$${TIMESTAMP}_$BUILD_ID"

        echo "=========================================="
        echo "Uploading Trivy reports"
        echo "=========================================="

        echo "Destination:"
        echo "$$REPORT_PATH"

        # HTML
        gcloud storage cp \
          /workspace/trivy-report.html \
          "$$REPORT_PATH/trivy-report.html"

        # JSON
        gcloud storage cp \
          /workspace/trivy-report.json \
          "$$REPORT_PATH/trivy-report.json"

        # Metadata
        gcloud storage cp \
          /workspace/metadata.json \
          "$$REPORT_PATH/metadata.json"

        echo ""
        echo "=========================================="
        echo "Reports uploaded successfully"
        echo "=========================================="

        gcloud storage ls "$$REPORT_PATH/"


  # ============================================================
  # 7. DEPLOY TO CLOUD RUN
  # ============================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'DEPLOY-CLOUD-RUN'
    waitFor:
      - 'UPLOAD-REPORTS'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--quiet'


# ================================================================
# SUBSTITUTIONS
# ================================================================
substitutions:

  _REGION: 'asia-south1'

  _REPOSITORY: 'sk-trivy'

  _IMAGE: 'python-app'

  _SERVICE_NAME: 'sk-trivy-app'

  _REPORT_BUCKET: 'gcp-sanbox-exp-trivy-reports'


# ================================================================
# CLOUD BUILD LOGGING
# ================================================================
options:
  logging: CLOUD_LOGGING_ONLY

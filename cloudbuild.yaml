steps:

  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'BUILD-IMAGE'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'PUSH-IMAGE'
    waitFor:
      - 'BUILD-IMAGE'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'

  # 3. Scan image with Trivy
  - name: 'aquasec/trivy'
    id: 'TRIVY-SCAN'
    waitFor:
      - 'PUSH-IMAGE'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'DEPLOY-CLOUD-RUN'
    waitFor:
      - 'TRIVY-SCAN'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--quiet'


# Default substitutions
substitutions:
  _REGION: 'asia-south1'
  _REPOSITORY: 'sk-trivy'
  _IMAGE: 'python-app'
  _SERVICE_NAME: 'sk-trivy-app'


# Send build logs to Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
